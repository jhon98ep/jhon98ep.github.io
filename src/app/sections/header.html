<header [class.scrolled]="scrolled()">
  <div class="container bar">
    <a class="logo" href="#inicio">Jhon Estrada<span class="dot">.</span></a>

    <nav [class.open]="menuOpen()" aria-label="Principal">
      @for (item of nav; track item.id; let i = $index) {
        <a [href]="'#' + item.id" (click)="menuOpen.set(false)">
          <span class="n">0{{ i + 1 }}</span>{{ i18n.t(item.label) }}
        </a>
      }
    </nav>

    <div class="actions">
      <button class="lang" type="button" (click)="i18n.toggle()"
              [attr.aria-label]="i18n.lang() === 'es' ? 'Switch to English' : 'Cambiar a español'">
        <span [class.on]="i18n.lang() === 'es'">ES</span>
        <span class="sep">/</span>
        <span [class.on]="i18n.lang() === 'en'">EN</span>
      </button>
      <a class="cv link" [href]="profile.cv" download>{{ i18n.t({ es: 'CV', en: 'Résumé' }) }} ↓</a>
      <button class="burger" type="button" (click)="menuOpen.set(!menuOpen())"
              [class.x]="menuOpen()" [attr.aria-expanded]="menuOpen()" aria-label="Menú">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>
